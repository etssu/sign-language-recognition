[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-language-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "opencv-python",
    "mediapipe",
    "scikit-learn",
    "joblib",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ui*",
    "realtime*",
    "classifiers*",
]